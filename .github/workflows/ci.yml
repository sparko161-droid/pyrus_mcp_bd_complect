name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pyrus_mcp_server

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync

    - name: Run Ruff Linter
      run: uv run ruff check .

    - name: Run Ruff Formatter check
      run: uv run ruff format --check .

    - name: Run Mypy Type Checker
      run: uv run mypy .

    - name: Run Pytest
      run: uv run pytest tests/

    - name: Check API Contract Drift
      run: python ../scripts/check-contract-drift.py

    - name: Check DONE tasks evidence and deps
      run: pip install pyyaml && python ../scripts/check-done-tasks.py

    - name: Check Phase Exit and Red-Team Review
      run: python ../scripts/check-phase-exit.py
