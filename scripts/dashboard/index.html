<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pyrus MCP — инженерный roadmap</title>
<style>
  @font-face {
    font-family: "Martian Mono";
    font-weight: 500 700;
    font-style: normal;
    font-display: swap;
    src: url(/fonts/mm-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212;
  }
  @font-face {
    font-family: "Martian Mono";
    font-weight: 500 700;
    font-style: normal;
    font-display: swap;
    src: url(/fonts/mm-cyrillic.woff2) format("woff2");
    unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }

  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #e4e9ef;
    --ink: #19212f;
    --ink-soft: #4d596b;
    --ink-faint: #7c8798;
    --line: #d4dbe4;
    --line-soft: #e3e8ee;
    --accent: #cc7a1f;
    --accent-ink: #7a4811;
    --accent-soft: #f7e3cb;
    --focus: #2b6cb0;

    --c-planned-bg: #e6e9ee;
    --c-planned-fg: #5b6478;
    --c-ready-bg: #dcf1ee;
    --c-ready-fg: #187066;
    --c-progress-bg: #fdead0;
    --c-progress-fg: #96550a;
    --c-review-bg: #dfe8f8;
    --c-review-fg: #2d558f;
    --c-done-bg: #e0f0e2;
    --c-done-fg: #276b3a;
    --c-blocked-bg: #fbe1e1;
    --c-blocked-fg: #a4302f;
    --c-live: #2f9e64;

    --shadow-1: 0 1px 2px rgba(25, 33, 47, 0.06), 0 1px 1px rgba(25, 33, 47, 0.04);
    --shadow-2: 0 8px 24px rgba(25, 33, 47, 0.14), 0 2px 6px rgba(25, 33, 47, 0.08);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151e;
      --surface: #171e29;
      --surface-2: #202a38;
      --ink: #e7ecf3;
      --ink-soft: #a3aebe;
      --ink-faint: #6e7889;
      --line: #2b3545;
      --line-soft: #212a38;
      --accent: #e8934a;
      --accent-ink: #ffd9ab;
      --accent-soft: #3a2a17;
      --focus: #6ea8e0;

      --c-planned-bg: #232c39;
      --c-planned-fg: #97a2b4;
      --c-ready-bg: #123832;
      --c-ready-fg: #6bd6c4;
      --c-progress-bg: #3a2b12;
      --c-progress-fg: #eab35c;
      --c-review-bg: #1c2c47;
      --c-review-fg: #9dbdec;
      --c-done-bg: #17321f;
      --c-done-fg: #7fce93;
      --c-blocked-bg: #3a1a1a;
      --c-blocked-fg: #f0a3a1;
      --c-live: #4fce8b;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-2: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  a { color: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }
  .title-block { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .eyebrow-row { display: flex; align-items: center; gap: 10px; }
  .eyebrow {
    font-family: "Martian Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-ink);
    font-weight: 600;
  }
  .live-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: "Martian Mono", monospace; font-size: 10px; letter-spacing: 0.06em;
    color: var(--c-live); border: 1px solid color-mix(in srgb, var(--c-live) 45%, transparent);
    border-radius: 999px; padding: 2px 8px 2px 6px;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-live); }
  .live-pill.stale { color: var(--ink-faint); border-color: var(--line); }
  .live-pill.stale .live-dot { background: var(--ink-faint); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-pill:not(.stale) .live-dot { animation: pulse 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .live-pill .live-dot { animation: none; } }

  h1 {
    margin: 0;
    font-family: "Martian Mono", monospace;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 28px);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .subtitle { color: var(--ink-soft); font-size: 13.5px; }

  .meta-strip { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; }
  .meta-stat { text-align: right; }
  .meta-stat .num {
    font-family: "Martian Mono", monospace;
    font-weight: 700;
    font-size: 22px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .meta-stat .lbl { display: block; font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }

  section.phases-overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    gap: 10px;
    margin-bottom: 26px;
  }
  .phase-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 13px 11px;
    cursor: pointer;
    text-align: left;
    box-shadow: var(--shadow-1);
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .phase-tile:hover { transform: translateY(-1px); border-color: var(--accent); }
  .phase-tile.dimmed { opacity: 0.4; }
  .phase-tile .ph-name { font-size: 12px; color: var(--ink-soft); }
  .phase-tile .ph-num { font-family: "Martian Mono", monospace; font-weight: 700; font-size: 15px; }
  .phase-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow: hidden;
    display: flex;
  }
  .phase-bar span { display: block; height: 100%; }
  .phase-tile .ph-count { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    margin-bottom: 22px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .chipset { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    line-height: 1.3;
    user-select: none;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  select#role-filter, input#search {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  select#role-filter:focus, input#search:focus, .chip:focus-visible, .task:focus-visible, .dep-link:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  input#search { width: 220px; max-width: 40vw; }
  .controls .spacer { flex: 1; }
  .result-count { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

  .phase-section { margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .phase-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    background: var(--surface);
  }
  .phase-head:hover { background: var(--line-soft); }
  .phase-head .chevron { font-family: "Martian Mono", monospace; color: var(--ink-faint); transition: transform 0.15s ease; font-size: 12px; }
  .phase-section.open .chevron { transform: rotate(90deg); }
  .phase-head h2 { margin: 0; font-size: 15px; font-family: "Martian Mono", monospace; font-weight: 700; }
  .phase-head .ph-sub { color: var(--ink-faint); font-size: 12.5px; }
  .phase-body { display: none; padding: 4px 12px 14px; }
  .phase-section.open .phase-body { display: block; }

  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 8px; }

  .task {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    padding: 10px 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .task:hover { border-color: var(--accent); box-shadow: var(--shadow-1); }
  .task-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .task-id { font-family: "Martian Mono", monospace; font-size: 11.5px; color: var(--ink-faint); }
  .status-pill {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .task-title { font-size: 13px; line-height: 1.35; }
  .task-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
  .role-badge { font-size: 11px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { display: flex; gap: 5px; flex-shrink: 0; }
  .badge {
    font-family: "Martian Mono", monospace;
    font-size: 10px;
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
  }
  .badge.warn { color: var(--c-blocked-fg); border-color: var(--c-blocked-fg); }

  .task.hidden { display: none; }

  .veil {
    position: fixed; inset: 0; background: rgba(10, 14, 20, 0.45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 6vh 16px; z-index: 40; overflow-y: auto;
  }
  .veil.show { display: flex; }
  .detail {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    max-width: 560px;
    width: 100%;
    box-shadow: var(--shadow-2);
    padding: 22px 24px 24px;
  }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .detail-id { font-family: "Martian Mono", monospace; font-size: 12px; color: var(--ink-faint); }
  .detail h3 { margin: 4px 0 2px; font-size: 18px; text-wrap: balance; }
  .close-btn {
    border: none; background: var(--surface-2); color: var(--ink-soft);
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: var(--line); }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 16px 0 0; font-size: 13px; }
  .detail dt { color: var(--ink-faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 2px; }
  .detail dd { margin: 0; }
  .dep-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: "Martian Mono", monospace; font-size: 11.5px;
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; margin: 0 5px 5px 0;
    cursor: pointer; background: var(--surface);
  }
  .dep-link:hover { border-color: var(--accent); }
  .discovery-box {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: var(--c-blocked-bg); border: 1px solid color-mix(in srgb, var(--c-blocked-fg) 35%, transparent);
  }
  .discovery-box + .discovery-box { margin-top: 8px; }
  .discovery-box .d-head { font-family: "Martian Mono", monospace; font-size: 11px; font-weight: 700; color: var(--c-blocked-fg); margin-bottom: 4px; }
  .discovery-box p { margin: 3px 0; font-size: 12.5px; color: var(--ink-soft); }

  footer.legend {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-faint);
  }
  footer.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
  footer.legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  footer .src { margin-left: auto; font-family: "Martian Mono", monospace; }

  .empty-state {
    padding: 40px 20px; text-align: center; color: var(--ink-faint);
    border: 1px dashed var(--line); border-radius: var(--radius);
  }

  @media (max-width: 560px) {
    header.top { flex-direction: column; }
    .meta-strip { align-self: stretch; justify-content: space-between; }
    .meta-stat { text-align: left; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="title-block">
      <div class="eyebrow-row">
        <span class="eyebrow">Pyrus MCP — Engineering Registry</span>
        <span class="live-pill" id="live-pill"><span class="live-dot"></span><span id="live-label">live</span></span>
      </div>
      <h1>Pyrus MCP: инженерный roadmap</h1>
      <span class="subtitle">Живая карта <span id="total-count">—</span> задач из <span class="mono">tasks/registry.yaml</span> — обновляется автоматически при изменении файла.</span>
    </div>
    <div class="meta-strip" id="meta-strip"></div>
  </header>

  <div class="controls" style="margin-bottom:12px; justify-content:center;">
    <div class="chipset" id="view-toggle">
      <button class="chip" data-view="board" aria-pressed="true">📋 Task Board</button>
      <button class="chip" data-view="control" aria-pressed="false">🛡️ Control View</button>
    </div>
  </div>

  <div id="view-board">
    <section class="phases-overview" id="phases-overview" aria-label="Обзор фаз"></section>
    <div class="controls">
      <div class="chipset" id="status-filters" role="group" aria-label="Фильтр по статусу"></div>
      <select id="role-filter" aria-label="Фильтр по роли">
        <option value="">Все роли</option>
      </select>
      <input id="search" type="search" placeholder="Поиск: ID или текст задачи…" aria-label="Поиск задач" />
      <div class="spacer"></div>
      <button id="btn-rules" type="button" class="chip" style="background: var(--surface-2); font-weight:bold;">⚖️ Правила (Rules)</button>
      <span class="result-count" id="result-count"></span>
    </div>
    <div id="board"><div class="empty-state">Загрузка…</div></div>
  </div>

  <div id="view-control" style="display:none; display:flex; flex-direction:column; gap:20px;">
    <div class="phase-section open">
      <div class="phase-head" style="background:var(--c-review-bg); color:var(--c-review-fg); cursor:default;">
        <h2>🌊 Wave Gates & Phase Architecture</h2>
      </div>
      <div class="phase-body" id="control-waves" style="display:block; padding:16px;"></div>
    </div>
    
    <div class="phase-section open">
      <div class="phase-head" style="background:var(--c-blocked-bg); color:var(--c-blocked-fg); cursor:default;">
        <h2>🛑 Active Blockers & Rule Violations</h2>
      </div>
      <div class="phase-body" id="control-blockers" style="display:block; padding:16px;"></div>
    </div>
  </div>

  <footer class="legend" id="legend"></footer>

</div>

<div class="veil" id="veil">
  <div class="detail" id="detail" role="dialog" aria-modal="true"></div>
</div>

<script>
(() => {
  "use strict";

  const STATUS_META = {
    PLANNED:   { label: "Planned",    bg: "var(--c-planned-bg)",  fg: "var(--c-planned-fg)",  bucket: "planned" },
    BACKLOG:   { label: "Backlog",    bg: "var(--c-planned-bg)",  fg: "var(--c-planned-fg)",  bucket: "planned" },
    READY:     { label: "Ready",      bg: "var(--c-ready-bg)",    fg: "var(--c-ready-fg)",    bucket: "ready" },
    IN_PROGRESS:{ label: "In progress", bg: "var(--c-progress-bg)", fg: "var(--c-progress-fg)", bucket: "progress" },
    REVIEW:    { label: "Review",     bg: "var(--c-review-bg)",   fg: "var(--c-review-fg)",   bucket: "review" },
    QA:        { label: "QA",         bg: "var(--c-review-bg)",   fg: "var(--c-review-fg)",   bucket: "review" },
    SECURITY:  { label: "Security",   bg: "var(--c-review-bg)",   fg: "var(--c-review-fg)",   bucket: "review" },
    ACCEPTANCE:{ label: "Acceptance", bg: "var(--c-review-bg)",   fg: "var(--c-review-fg)",   bucket: "review" },
    DONE:      { label: "Done",       bg: "var(--c-done-bg)",     fg: "var(--c-done-fg)",     bucket: "done" },
    ARCHITECTURE_BLOCKED: { label: "Blocked · arch", bg: "var(--c-blocked-bg)", fg: "var(--c-blocked-fg)", bucket: "blocked" },
    PRODUCT_BLOCKED:      { label: "Blocked · product", bg: "var(--c-blocked-bg)", fg: "var(--c-blocked-fg)", bucket: "blocked" },
    SECURITY_BLOCKED:     { label: "Blocked · security", bg: "var(--c-blocked-bg)", fg: "var(--c-blocked-fg)", bucket: "blocked" },
    DEPENDENCY_BLOCKED:   { label: "Blocked · dependency", bg: "var(--c-blocked-bg)", fg: "var(--c-blocked-fg)", bucket: "blocked" },
  };
  const BUCKET_ORDER = ["planned", "ready", "progress", "review", "blocked", "done"];
  const BUCKET_LABEL = { planned: "Planned", ready: "Ready", progress: "In progress", review: "Review/QA/Security", blocked: "Blocked", done: "Done" };
  const BUCKET_COLOR = { planned: "var(--c-planned-fg)", ready: "var(--c-ready-fg)", progress: "var(--c-progress-fg)", review: "var(--c-review-fg)", blocked: "var(--c-blocked-fg)", done: "var(--c-done-fg)" };

  let REGISTRY = { version: 0, tasks: [] };
  let tasksById = new Map();
  let phases = [];
  let phasesInfo = new Map();
  let roles = [];

  const state = {
    statuses: new Set(),
    role: "",
    query: "",
    dimPhase: null,
    openPhases: new Set([0]),
  };

  function bucketOf(status) { return (STATUS_META[status] || { bucket: "planned" }).bucket; }

  function recomputeIndexes() {
    tasksById = new Map(REGISTRY.tasks.map(t => [t.id, t]));
    phases = [...new Set(REGISTRY.tasks.map(t => t.phase))].sort((a, b) => a - b);
    roles = [...new Set(REGISTRY.tasks.map(t => t.primary))].sort();
    phasesInfo = new Map();
    if (REGISTRY.phases) {
      REGISTRY.phases.forEach(ph => phasesInfo.set(ph.id, ph));
    }
  }

  function renderMeta() {
    const el = document.getElementById("meta-strip");
    const counts = { review: 0, ready: 0, progress: 0, blocked: 0, done: 0, planned: 0 };
    for (const t of REGISTRY.tasks) counts[bucketOf(t.status)]++;
    const stats = [
      ["review", "На ревью"],
      ["ready", "Готовы к старту"],
      ["blocked", "Заблокировано"],
      ["done", "Завершено"],
    ];
    el.innerHTML = stats.map(([k, label]) => `
      <div class="meta-stat">
        <div class="num" style="color:${counts[k] ? BUCKET_COLOR[k] : 'var(--ink-faint)'}">${counts[k]}</div>
        <span class="lbl">${label}</span>
      </div>`).join("");
  }

  function phaseName(p) {
    const ph = phasesInfo.get(p);
    return ph ? ph.name : `Фаза ${p}`;
  }

  function renderPhaseOverview() {
    const el = document.getElementById("phases-overview");
    el.innerHTML = phases.map(p => {
      const list = REGISTRY.tasks.filter(t => t.phase === p);
      const segs = BUCKET_ORDER.map(b => {
        const n = list.filter(t => bucketOf(t.status) === b).length;
        return n ? `<span style="width:${(n / list.length) * 100}%; background:${BUCKET_COLOR[b]}"></span>` : "";
      }).join("");
      const doneish = list.filter(t => ["review", "done"].includes(bucketOf(t.status))).length;
      return `
        <button class="phase-tile" data-phase="${p}" type="button">
          <div><span class="ph-num">P${p}</span> <span class="ph-name">${phaseName(p)}</span></div>
          <div class="phase-bar">${segs}</div>
          <div class="ph-count">${doneish}/${list.length} на ревью+</div>
        </button>`;
    }).join("");
    el.querySelectorAll(".phase-tile").forEach(btn => {
      btn.addEventListener("click", () => {
        const p = Number(btn.dataset.phase);
        state.dimPhase = state.dimPhase === p ? null : p;
        applyFilters();
        if (state.dimPhase !== null) {
          state.openPhases.add(p);
          renderBoard();
          applyFilters();
          const section = document.querySelector(`.phase-section[data-phase="${p}"]`);
          if (section) section.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });
  }

  function renderFilters() {
    const sf = document.getElementById("status-filters");
    sf.innerHTML = BUCKET_ORDER.map(b => `
      <button class="chip" data-bucket="${b}" type="button" aria-pressed="${state.statuses.has(b)}">
        <span class="dot" style="background:${BUCKET_COLOR[b]}"></span>${BUCKET_LABEL[b]}
      </button>`).join("");
    sf.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const b = chip.dataset.bucket;
        if (state.statuses.has(b)) state.statuses.delete(b); else state.statuses.add(b);
        chip.setAttribute("aria-pressed", state.statuses.has(b) ? "true" : "false");
        applyFilters();
      });
    });

    const rf = document.getElementById("role-filter");
    const prevRole = rf.value;
    rf.innerHTML = '<option value="">Все роли</option>' + roles.map(r => `<option value="${r}">${r}</option>`).join("");
    rf.value = roles.includes(prevRole) ? prevRole : "";
    state.role = rf.value;
    rf.onchange = () => { state.role = rf.value; applyFilters(); };

    const search = document.getElementById("search");
    search.oninput = (e) => { state.query = e.target.value.trim().toLowerCase(); applyFilters(); };
  }

  function renderBoard() {
    const board = document.getElementById("board");
    if (REGISTRY.tasks.length === 0) {
      board.innerHTML = '<div class="empty-state">Реестр пуст или ещё не загружен.</div>';
      return;
    }
    board.innerHTML = phases.map(p => {
      const list = REGISTRY.tasks.filter(t => t.phase === p);
      const doneish = list.filter(t => ["review", "done"].includes(bucketOf(t.status))).length;
      const ph = phasesInfo.get(p);
      const revTask = list.find(t => t.id.startsWith("REV-"));
      
      let revBadge = "";
      if (revTask) {
        if (revTask.status === "DONE") revBadge = `<span style="margin-left:12px; font-size:11px; padding:2px 8px; border-radius:12px; background:var(--c-done-bg); color:var(--c-done-fg);">Sign-off: APPROVED</span>`;
        else if (revTask.status === "PLANNED") revBadge = `<span style="margin-left:12px; font-size:11px; padding:2px 8px; border-radius:12px; background:var(--surface-2); color:var(--ink-soft);">Sign-off: PENDING</span>`;
        else revBadge = `<span style="margin-left:12px; font-size:11px; padding:2px 8px; border-radius:12px; background:var(--c-review-bg); color:var(--c-review-fg);">Sign-off: ${revTask.status}</span>`;
      }
      
      const exitCriteria = ph && ph.exit ? `<div style="padding: 12px 14px; margin-bottom: 12px; background: var(--surface-2); border-radius: 6px; font-size: 13px; color: var(--ink-soft);"><strong>🎯 Exit Criteria:</strong> ${escapeHTML(ph.exit)}</div>` : "";

      return `
        <section class="phase-section${state.openPhases.has(p) ? " open" : ""}" data-phase="${p}">
          <div class="phase-head">
            <span class="chevron">▸</span>
            <h2 style="display:flex; align-items:center;">P${p} · ${phaseName(p)} ${revBadge}</h2>
            <span class="ph-sub mono" style="margin-left:auto;">${doneish}/${list.length}</span>
          </div>
          <div class="phase-body">
            ${exitCriteria}
            <div class="task-grid">
              ${list.map(taskCardHTML).join("")}
            </div>
          </div>
        </section>`;
    }).join("");

    board.querySelectorAll(".phase-head").forEach(h => {
      h.addEventListener("click", () => {
        const section = h.closest(".phase-section");
        const p = Number(section.dataset.phase);
        section.classList.toggle("open");
        if (section.classList.contains("open")) state.openPhases.add(p); else state.openPhases.delete(p);
      });
    });
    board.querySelectorAll(".task").forEach(card => {
      card.addEventListener("click", () => openDetail(card.dataset.id));
    });
  }

  function taskCardHTML(t) {
    const m = STATUS_META[t.status] || STATUS_META.PLANNED;
    const deps = t.deps || [];
    const discLinks = t.discovery_links || [];
    const depBadge = deps.length ? `<span class="badge" title="Зависимости">deps ${deps.length}</span>` : "";
    const discBadge = discLinks.length ? `<span class="badge warn" title="Discovery">disc ${discLinks.length}</span>` : "";
    return `
      <button class="task" type="button" data-id="${t.id}" data-status="${t.status}" data-role="${t.primary}"
        data-search="${(t.id + " " + t.title).toLowerCase().replace(/"/g, "&quot;")}">
        <div class="task-top">
          <span class="task-id">${t.id}</span>
          <span class="status-pill" style="background:${m.bg}; color:${m.fg}">${m.label}</span>
        </div>
        <div class="task-title">${escapeHTML(t.title)}</div>
        <div class="task-bottom">
          <span class="role-badge">${t.primary}</span>
          <span class="badges">${depBadge}${discBadge}</span>
        </div>
      </button>`;
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function applyFilters() {
    let visible = 0;
    document.querySelectorAll(".task").forEach(card => {
      const bucket = bucketOf(card.dataset.status);
      const okStatus = state.statuses.size === 0 || state.statuses.has(bucket);
      const okRole = !state.role || card.dataset.role === state.role;
      const okQuery = !state.query || card.dataset.search.includes(state.query);
      const show = okStatus && okRole && okQuery;
      card.classList.toggle("hidden", !show);
      if (show) visible++;
    });
    document.querySelectorAll(".phase-tile").forEach(tile => {
      tile.classList.toggle("dimmed", state.dimPhase !== null && Number(tile.dataset.phase) !== state.dimPhase);
    });
    document.querySelectorAll(".phase-section").forEach(sec => {
      const dim = state.dimPhase !== null && Number(sec.dataset.phase) !== state.dimPhase;
      sec.style.opacity = dim ? "0.35" : "1";
    });
    const totalTasks = document.querySelectorAll(".task").length;
    document.getElementById("result-count").textContent = `${visible} из ${totalTasks}`;
  }

  function openDetail(id) {
    const detail = document.getElementById("detail");

    if (id === "RULES") {
      let rulesHTML = "";
      if (REGISTRY.rules) {
        rulesHTML = Object.entries(REGISTRY.rules).map(([k, v]) => `
          <div style="margin-bottom:12px;">
            <div style="font-family:'Martian Mono', monospace; font-size:11px; font-weight:bold; color:var(--accent); text-transform:uppercase; margin-bottom:4px;">${k}</div>
            <div style="font-size:13px;">${escapeHTML(v)}</div>
          </div>
        `).join("");
      }
      detail.innerHTML = `
        <div class="detail-top">
          <div>
            <div class="detail-id">GOVERNANCE</div>
            <h3>Правила разработки (Rules)</h3>
          </div>
          <button class="close-btn" id="detail-close" type="button" aria-label="Закрыть">✕</button>
        </div>
        <div style="margin-top:16px;">${rulesHTML || "Нет загруженных правил."}</div>
      `;
      detail.querySelector("#detail-close").addEventListener("click", closeDetail);
      document.getElementById("veil").classList.add("show");
      return;
    }

    const t = tasksById.get(id);
    if (!t) return;
    const m = STATUS_META[t.status] || STATUS_META.PLANNED;
    const t_deps = t.deps || [];
    const deps = t_deps.map(d => {
      const dep = tasksById.get(d);
      const dm = dep ? (STATUS_META[dep.status] || STATUS_META.PLANNED) : null;
      return `<span class="dep-link" data-jump="${d}"><span class="mono">${d}</span>${dm ? ` · ${dm.label}` : ""}</span>`;
    }).join("") || "<span style=\"color:var(--ink-faint)\">нет</span>";

    const t_discLinks = t.discovery_links || [];
    const discoveries = t_discLinks.map(d => `
      <div class="discovery-box">
        <div class="d-head">${d.discovery_id} · ${d.type} · ${d.priority}${d.blocking ? " · BLOCKING" : ""}</div>
        <p><strong>Находка:</strong> ${escapeHTML(d.finding)}</p>
        <p><strong>Почему важно:</strong> ${escapeHTML(d.why_it_matters)}</p>
        ${d.proposed_task ? `<p><strong>Предложено:</strong> ${escapeHTML(d.proposed_task)}</p>` : ""}
      </div>`).join("");

    detail.innerHTML = `
      <div class="detail-top">
        <div>
          <div class="detail-id">${t.id} · Phase ${t.phase}</div>
          <h3>${escapeHTML(t.title)}</h3>
        </div>
        <button class="close-btn" id="detail-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <span class="status-pill" style="background:${m.bg}; color:${m.fg}">${m.label}</span>
      <dl>
        <dt>Исполнитель</dt><dd>${t.primary}</dd>
        <dt>Ревьюер</dt><dd>${t.reviewer || "—"}</dd>
        <dt>Gate owners</dt><dd>${(t.gate_owners || []).length ? t.gate_owners.join(", ") : "—"}</dd>
        <dt>Зависит от</dt><dd>${deps}</dd>
        <dt>Blocked reason</dt><dd>${t.blocked_reason ? escapeHTML(t.blocked_reason) : "—"}</dd>
        ${t.discovered_from ? `<dt>Из discovery</dt><dd><span class="mono">${t.origin_discovery}</span> (${t.discovered_from})</dd>` : ""}
      </dl>
      ${discoveries}
    `;
    detail.querySelector("#detail-close").addEventListener("click", closeDetail);
    detail.querySelectorAll(".dep-link").forEach(el => {
      el.addEventListener("click", () => openDetail(el.dataset.jump));
    });
    document.getElementById("veil").classList.add("show");
  }
  function closeDetail() { document.getElementById("veil").classList.remove("show"); }
  document.getElementById("veil").addEventListener("click", (e) => { if (e.target.id === "veil") closeDetail(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

  function renderLegend() {
    const el = document.getElementById("legend");
    el.innerHTML = BUCKET_ORDER.map(b => `<span class="lg"><span class="dot" style="background:${BUCKET_COLOR[b]}"></span>${BUCKET_LABEL[b]}</span>`).join("")
      + `<span class="src">tasks/registry.yaml · v${REGISTRY.version}</span>`;
  }

  function renderControlView() {
    const wavesEl = document.getElementById("control-waves");
    const blockersEl = document.getElementById("control-blockers");
    
    if (!REGISTRY.waves) {
      wavesEl.innerHTML = "No waves defined.";
      return;
    }

    let wavesHTML = "";
    for (const w of REGISTRY.waves) {
      wavesHTML += `<div style="border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; padding: 12px; background: var(--surface);">`;
      wavesHTML += `<h3 style="margin:0 0 8px; font-family:'Martian Mono', monospace;">${w.id}: ${w.name} <span class="badge">${w.gate_status}</span></h3>`;
      
      const phaseDetails = w.phases.map(p => {
        const ph = phasesInfo.get(p);
        const pTasks = REGISTRY.tasks.filter(t => t.phase === p);
        const revTask = pTasks.find(t => t.id.startsWith("REV-"));
        let revState = revTask ? revTask.status : "NO_GATE";
        let color = revState === "DONE" ? "var(--c-done-fg)" : (revState === "PLANNED" ? "var(--ink-faint)" : "var(--c-review-fg)");
        
        return `<div style="display:flex; justify-content:space-between; padding:4px 0; border-top:1px dashed var(--line-soft);">
          <span style="font-size:13px; color:var(--ink-soft);">P${p}: ${ph ? ph.name : ""}</span>
          <strong style="font-size:12px; color:${color};">Phase Gate: ${revState}</strong>
        </div>`;
      }).join("");

      wavesHTML += phaseDetails;
      wavesHTML += `</div>`;
    }
    wavesEl.innerHTML = wavesHTML;

    // Rule violations and blockers
    const blockedTasks = REGISTRY.tasks.filter(t => bucketOf(t.status) === "blocked");
    const violations = REGISTRY.tasks.filter(t => t.status !== "DONE" && t.status !== "PLANNED" && (!t.reviewer || !t.gate_owners || t.gate_owners.length === 0));
    
    let blockHTML = "";
    if (blockedTasks.length > 0) {
      blockHTML += `<h4 style="margin:0 0 8px; color:var(--c-blocked-fg);">Blocked Tasks (${blockedTasks.length})</h4>`;
      blockHTML += blockedTasks.map(t => `<div style="font-size:13px; margin-bottom:6px;"><strong>${t.id}:</strong> ${escapeHTML(t.title)} <br><span style="color:var(--ink-faint)">Reason: ${escapeHTML(t.blocked_reason || "unknown")}</span></div>`).join("");
    }
    
    if (violations.length > 0) {
      blockHTML += `<h4 style="margin:16px 0 8px; color:var(--c-progress-fg);">Rule Violations (Missing Reviewer/Gate Owner)</h4>`;
      blockHTML += violations.map(t => `<div style="font-size:13px; margin-bottom:4px;"><strong>${t.id}:</strong> ${escapeHTML(t.title)}</div>`).join("");
    }
    
    blockersEl.innerHTML = blockHTML || "<div style='font-size:13px; color:var(--ink-faint);'>All good. No blockers or rule violations found.</div>";
  }

  function renderAll() {
    recomputeIndexes();
    document.getElementById("total-count").textContent = REGISTRY.tasks.length;
    renderMeta();
    renderPhaseOverview();
    renderFilters();
    renderBoard();
    renderControlView();
    renderLegend();
    applyFilters();
    
    const rulesBtn = document.getElementById("btn-rules");
    if (rulesBtn) rulesBtn.onclick = () => openDetail("RULES");

    document.querySelectorAll("#view-toggle .chip").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#view-toggle .chip").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        if (btn.dataset.view === "board") {
          document.getElementById("view-board").style.display = "block";
          document.getElementById("view-control").style.display = "none";
        } else {
          document.getElementById("view-board").style.display = "none";
          document.getElementById("view-control").style.display = "flex";
        }
      };
    });
  }

  async function loadRegistry() {
    const res = await fetch("/api/registry.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`registry.json ${res.status}`);
    REGISTRY = await res.json();
  }

  function setLive(isLive) {
    const pill = document.getElementById("live-pill");
    const label = document.getElementById("live-label");
    pill.classList.toggle("stale", !isLive);
    label.textContent = isLive ? "live" : "reconnecting…";
  }

  async function boot() {
    try {
      await loadRegistry();
      renderAll();
      setLive(true);
    } catch (err) {
      document.getElementById("board").innerHTML =
        `<div class="empty-state">Не удалось загрузить tasks/registry.yaml: ${escapeHTML(String(err))}</div>`;
      setLive(false);
    }

    // Live updates: the server watches tasks/registry.yaml and pushes an
    // SSE event on every change, so this reloads data the moment someone
    // runs a task-registry command -- no manual refresh needed.
    const connect = () => {
      const es = new EventSource("/events");
      es.addEventListener("open", () => setLive(true));
      es.addEventListener("registry-changed", async () => {
        try {
          await loadRegistry();
          renderAll();
        } catch { /* transient read during a write; next event will fix it */ }
      });
      es.addEventListener("error", () => {
        setLive(false);
        es.close();
        setTimeout(connect, 2000);
      });
    };
    connect();
  }

  boot();
})();
</script>
</body>
</html>
