## Assignment rules
- Every task has one primary executor and at least one independent reviewer.
- The Pyrus Integrations Lead owns the Pyrus API contracts and guarantees 1:1 mapping with the old Railway MCP.
- The AI CTO owns orchestration, not product decisions reserved for the Human Architect.
- Agents use Antigravity tools; role and gate are strictly enforced through handoffs.
