phase_overrides:
  - id: 9
    name: parity-gate-reopened
    exit: "Pyrus official API v4 matrix is 100% mapped; every row is implemented/tested or has an approved ADR; no unverified parity claim remains."
  - id: 17
    name: knowledge-mcp-reopened
    exit: "Knowledge MCP has tenant-safe immutable lifecycle, current-version indexing, hybrid retrieval, evidence, benchmark and verified Pyrus KB projection."
  - id: 20
    name: pyrus-api-compliance-2026
    exit: "All official Pyrus v4 methods are mapped to MCP tools, schemas, scopes, fixtures and tests."
  - id: 21
    name: knowledge-learning-system
    exit: "Cases continuously become evidence/candidates/approved knowledge, retrieval is measurable, stale data is suppressed and agent feedback returns to the bank."
  - id: 22
    name: iiko-api-contract-recovery
    exit: "Official iiko Cloud/iikoServer snapshots, auth model and method matrix are versioned and reconciled."
  - id: 23
    name: iiko-mcp-foundation
    exit: "iiko MCP client, domain model, scope/idempotency/error contracts and read surface are green."
  - id: 24
    name: cross-ecosystem-architecture-gates
    exit: "Cross-MCP boundaries, documentation/code parity, versioning and operational gates pass for Pyrus, Knowledge and iiko."
  - id: 25
    name: agent-evaluation-and-release
    exit: "Agent benchmarks prove retrieval usefulness, citation correctness, no tenant leakage and correct API tool selection."

