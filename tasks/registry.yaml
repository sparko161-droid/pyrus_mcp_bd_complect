version: 3
status: ACTIVE
rules:
  atomicity: One task = one independently testable outcome.
  ownership: Exactly one primary executor, at least one independent reviewer, explicit gate owners.
  discovery: New findings create linked tasks; silent scope expansion is forbidden.
  evidence: DONE requires code/docs/tests/evidence links appropriate to the task.
  phase_exit: A phase closes only when its exit criteria are green and no unaccepted P0/P1 blocker remains.
  phase_review: Every phase must conclude with a comprehensive review of all deliverables for ecosystem coherence and structure.
waves:
  - id: W1
    name: Foundation & Threat Modeling
    phases:
      - 0
      - 1
      - 2
    status: IN_PROGRESS
    gate_status: APPROVED
  - id: W2
    name: Core Protocol & Parity
    phases:
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    status: PLANNED
    gate_status: APPROVED
  - id: W3
    name: Advanced Features & Production
    phases:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
    status: DONE
    gate_status: APPROVED
  - id: W4
    name: Knowledge Base & Ecosystem
    phases:
      - 16
      - 17
      - 18
    status: DONE
    gate_status: APPROVED
phases:
  - id: 0
    name: contract-recovery
    exit: Legacy 1:1 catalogue, inventory, fixtures and API mapping are versioned and approved.
  - id: 1
    name: product-threat-model
    exit: Production product scope, tenant model, auth model, threat model and SLOs approved.
  - id: 2
    name: delivery-foundation
    exit: Local/CI/container foundation is reproducible and secure.
  - id: 3
    name: mcp-protocol-shell
    exit: Streamable HTTP + lifecycle + health + context + protocol conformance pass.
  - id: 4
    name: identity-tenancy
    exit: Multi-user authentication, authorization, scopes, tenant isolation and audit pass.
  - id: 5
    name: pyrus-client-core
    exit: Tenant credentials, auth refresh, API URLs, retries, limits and errors pass integration tests.
  - id: 6
    name: domain-models
    exit: Typed models and validation cover all required Pyrus domains.
  - id: 7
    name: readonly-parity
    exit: All recovered read-only legacy tools have contract tests and implementation.
  - id: 8
    name: write-parity
    exit: All recovered write tools have implementation, idempotency analysis and tests.
  - id: 9
    name: parity-gate
    exit: Compatibility matrix is green or exceptions are explicitly approved by ADR.
  - id: 10
    name: new-capabilities
    exit: Cache, comments pagination, registry pagination/status, batch operations and webhooks pass.
  - id: 11
    name: production-persistence
    exit: External persistent storage, migrations and recovery are proven.
  - id: 12
    name: observability-sre
    exit: Metrics, logs, alerts, SLOs and operational runbooks exist.
  - id: 13
    name: security-hardening
    exit: Security suite and staging DAST/fuzz/tenant-isolation checks are green.
  - id: 14
    name: staging-acceptance
    exit: Exact production artifact passes all staging acceptance gates.
  - id: 15
    name: production-release
    exit: Production rollout and rollback are demonstrated and accepted.
  - id: 16
    name: knowledge-contracts
    exit: Knowledge MCP contracts, data model and retrieval/publication rules are approved.
  - id: 17
    name: knowledge-mcp
    exit: Knowledge MCP supports versioned canonical storage, hybrid retrieval, embeddings and publication workflow in staging.
  - id: 18
    name: pyrusbot-integration
    exit: PyrusBot uses both MCPs through stable contracts and publication is evidence-backed.
  - id: 19
    name: future-interface
    exit: PyrusBot orchestration can be exposed through UI-neutral adapters.
