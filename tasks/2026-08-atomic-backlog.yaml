version: 1
status: ACTIVE
purpose: "Atomic executable backlog created by the 2026-08 deep audit. One task = one independently testable outcome."
priority_policy:
  P0: "Security/data-integrity/release-blocking. Must be resolved before production or merge of dependent implementation."
  P1: "Parity/correctness/architecture blocker. Must be resolved before the dependent phase closes."
  P2: "Quality/operability/maintainability improvement. May follow the blocking path only when explicitly accepted."
ownership_policy:
  primary: "single executor"
  reviewer: "independent reviewer"
  gates: "one or more explicit acceptance gates"
  evidence: "code + test + source/fixture/provenance evidence as applicable"

