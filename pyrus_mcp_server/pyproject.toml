[project]
name = "pyrus-mcp-server"
version = "1.0.0"
description = "Enterprise FastMCP Server for Pyrus v4 API with Multi-Tenancy, SQLite Persistence, and Observability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "starlette>=0.37.2",
    "uvicorn>=0.30.1",
    "tenacity>=9.0.0",
    "prometheus-client>=0.20.0"
]

[project.scripts]
pyrus-mcp = "pyrus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
